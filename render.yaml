services:
  - type: web
    name: zomato-ai-backend
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.0
      - key: GROQ_API_KEY
        sync: false
      - key: HF_DATASET_NAME
        value: ManikaSaini/zomato-restaurant-recommendation
      - key: DATASET_CACHE_PATH
        value: ./data/restaurants.parquet
